<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enigma. Бонусы v15</title>
<style>/* Enigma · Бонусы v12. Токены сняты с enigma-play.com (Reference/Design system/COMPONENTS.md) */
:root{
  --page:#111018; --card:rgba(31,29,40,.72); --ring:0 0 0 1px rgba(233,233,237,.08); --ring-acc:0 0 0 1px rgba(163,132,217,.22);
  --grad:linear-gradient(120deg,#352D47 0%,#1d1928 55%,#16141E 100%);
  --line:rgba(233,233,237,.1); --text:#E9E9ED; --title:#F5F4FF; --muted:#9690AB; --muted2:#78728C;
  --primary:#A384D9; --selected:#C6ABFC; --dark:#0D0C16; --green:#4EC98A; --red:#F28D92; --annot:#ffd34d;
  --pad:20px; --bh:36px;
  font-family:"Enigma Font",Inter,ui-sans-serif,system-ui,sans-serif; color:var(--text); background:#0a0910;
}
*{box-sizing:border-box} body{margin:0}
button,a{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
img{display:block}

/* ── Обвязка макета, не дизайн ── */
.tool{position:sticky;top:0;z-index:90;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;background:#060509;border-bottom:1px solid #26232f;font:13px Inter,system-ui}
.tool b{color:#fff;margin-right:4px}
.seg{display:inline-flex;border:1px solid #3a3446;border-radius:999px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;color:#9690AB;font-size:12px;font-weight:600}
.seg button.on{background:#C6ABFC;color:#0D0C16}
.layout{display:grid;grid-template-columns:240px 1fr}
.states{border-right:1px solid #26232f;padding:12px 8px;font:13px Inter,system-ui;background:#0c0b11;min-height:calc(100vh - 50px)}
.states button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:#9690AB}
.states button.on{background:#201e2a;color:#fff}
.states small{display:block;padding:14px 10px 4px;color:#6b6680;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.stage{padding:24px;overflow:auto}
.frame{margin:0 auto;background:var(--page);border:1px solid #26232f;border-radius:12px;overflow:hidden;position:relative}
.frame[data-w="1440"]{width:1440px}.frame[data-w="820"]{width:820px}.frame[data-w="390"]{width:390px}
.f390{--pad:16px;--bh:44px}.f820{--bh:44px}
body.annot [data-f]{outline:1px dashed var(--annot);outline-offset:1px;position:relative}
body.annot [data-f]::after{content:attr(data-f);position:absolute;left:0;top:-15px;z-index:5;white-space:nowrap;font:600 9.5px/14px Inter,system-ui;padding:0 4px;border-radius:3px;background:var(--annot);color:#1a1400;pointer-events:none}

/* ── Каркас сайта (как есть) ── */
.site-h{height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;border-bottom:1px solid var(--line)}
.site-h nav{display:flex;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.site-h nav span{padding:7px 9px}.site-h nav span.on{color:var(--text)}
.logo{font-size:30px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(180deg,#c9b2ff,#8a5cf0);-webkit-background-clip:text;color:transparent}
.site-h .r{display:flex;justify-content:flex-end;gap:8px;align-items:center;font-size:13px}
.bal{display:flex;align-items:center;border-radius:8px;box-shadow:var(--ring);overflow:hidden;height:36px}
.bal span{padding:0 10px;font-weight:600}.bal b{background:var(--primary);color:var(--dark);height:100%;display:grid;place-items:center;padding:0 12px;font-weight:600}
.ava{width:32px;height:32px;border-radius:50%;background:#2a2536;display:grid;place-items:center;font-size:12px;font-weight:600}
.bell{width:36px;height:36px;border-radius:8px;box-shadow:var(--ring);display:grid;place-items:center;color:var(--muted);position:relative;background:none;border:0}
.bell i{position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.f390 .site-h{grid-template-columns:auto 1fr;height:60px;padding:0 16px}.f390 .site-h nav{display:none}.f390 .logo{font-size:24px}
.f820 .site-h nav span:nth-child(n+4){display:none}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 410px}
.f820 .shell,.f390 .shell{grid-template-columns:minmax(0,1fr)}
.chat{border-left:1px solid var(--line);padding:16px;min-height:900px}
.f820 .chat,.f390 .chat{display:none}
.chat-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;box-shadow:var(--ring);background:var(--card);font-size:11px;color:var(--muted);text-align:center}
.chat-tabs span{padding:12px 0}.chat-tabs span.on{color:var(--selected);font-weight:600}
.chat-empty{margin-top:180px;text-align:center;color:var(--muted);font-size:12px}
.main{padding:24px 32px 56px;min-width:0}
.f390 .main{padding:16px 16px 48px}
.rhero{border-radius:16px;box-shadow:var(--ring);background:linear-gradient(110deg,#17151f 0%,#1f1a2c 60%,#2a2140 100%);overflow:hidden}
.rhero .in{padding:24px var(--pad) 20px}
.eyebrow{font-size:11px;line-height:16px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;color:var(--selected)}
.rhero h1{margin:4px 0 0;font-size:36px;font-weight:400;letter-spacing:-.9px;line-height:1.1;color:var(--title)}
.f390 .rhero h1{font-size:28px}
.rhero .cta{display:flex;gap:8px;margin-top:16px}
.tabs{display:flex;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none;padding:0 calc(var(--pad) - 12px)}
.tabs span{height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs span.on{color:var(--title);font-weight:500;box-shadow:inset 0 -2px 0 var(--primary)}
.f390 .tabs{flex-wrap:wrap;overflow:visible;padding:4px calc(var(--pad) - 12px)}

/* ── Общие детали ── */
.sh{margin:40px 0 16px;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.48px;color:var(--title)}
.btn{height:var(--bh);padding:0 16px;border-radius:8px;border:0;font-size:14px;font-weight:500;letter-spacing:-.2px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn,.ib,.tl,.opt,.amts button{transition:background .12s,box-shadow .12s,transform .12s}
.btn.p{background:var(--primary);color:var(--dark)}
.btn.p:hover{background:var(--selected)}.btn.s:hover{background:rgba(233,233,237,.06)}
.btn:active,.amts button:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:0;box-shadow:0 0 0 2px #111018,0 0 0 4px var(--selected)}
.btn.s.red{color:var(--red)}
.btn.s{background:none;color:var(--text);box-shadow:inset 0 0 0 2px rgba(150,144,171,.28)}
.btn.danger{background:var(--red);color:var(--dark)}
.btn.full{width:100%}.btn.lg{height:44px;font-size:15px}
.ib{width:var(--bh);height:var(--bh);min-width:40px;border-radius:8px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.ib:hover,.tl:hover{background:rgba(233,233,237,.06);color:var(--text)}
.ib.o{box-shadow:inset 0 0 0 2px rgba(150,144,171,.28);color:var(--text)}
.tl{background:none;border:0;height:var(--bh);padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);white-space:nowrap}
.panel{border-radius:16px;background:var(--card);box-shadow:var(--ring)}
.panel.acc{background:var(--grad);box-shadow:var(--ring-acc)}
.art{object-fit:contain;flex:none}
.lbl1{display:flex;align-items:center;gap:5px;height:16px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;color:var(--selected);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl1 svg{width:12px;height:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
.st.g{color:var(--green)}
/* Оффер: сумма, под ней потолок. Кегль суммы по длине строки */
.of{display:grid;min-width:0}
.of b{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.9px;color:var(--title);white-space:nowrap}
.of b.m{font-size:24px}.of b.l{font-size:20px;letter-spacing:-.4px}
.of span{font-size:13px;line-height:20px;font-weight:500;color:var(--selected);white-space:nowrap;min-height:20px}
.nw{white-space:nowrap}
/* Пары «метка: значение» */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.pair b{display:block;font-size:15px;line-height:20px;font-weight:600;color:var(--title);white-space:nowrap}
.bar{height:8px;border-radius:8px;background:rgba(233,233,237,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#A384D9,#C6ABFC)}
.bar.thin{height:4px}

/* ── Активный бонус + следующие: одна карточка ── */
.tb{margin-top:24px;padding:var(--pad);display:grid;grid-template-columns:72px minmax(0,1fr) 200px;column-gap:var(--pad);align-items:center;grid-template-areas:"art info act" "bar bar bar" "nums nums nums" "nxt nxt nxt"}
.tb>.art{grid-area:art;width:72px;height:72px}
.tb.noart{grid-template-columns:minmax(0,1fr) 200px;grid-template-areas:"info act" "bar bar" "nums nums" "nxt nxt"}
.tb-info{grid-area:info;min-width:0}
.tb-name{font-size:14px;line-height:20px;font-weight:500;color:var(--text);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-amt{font-size:40px;line-height:44px;font-weight:600;letter-spacing:-1.2px;color:var(--title);white-space:nowrap}.tb-amt.m{font-size:30px}.tb-amt.l{font-size:24px}
.tb-act{grid-area:act;display:grid;gap:4px}
.tb-act .two{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tb>.bar{grid-area:bar;margin-top:var(--pad)}
.tb-nums{grid-area:nums;display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;line-height:20px;color:var(--muted)}
.tb-nums{flex-wrap:wrap}.tb-nums b{color:var(--title);font-weight:600}.tb-nums .soon{color:var(--red);font-weight:600}
.nxt{grid-area:nxt}
.nxt{margin-top:var(--pad);border-top:1px solid var(--line);padding-top:12px}
.nxt .eyebrow{color:var(--muted);display:block;margin-bottom:4px}
.nx{display:grid;grid-template-columns:72px minmax(0,1fr) 40px auto;column-gap:var(--pad);align-items:center;min-height:64px;box-shadow:inset 0 1px 0 var(--line);padding:8px 0}
.nx:first-of-type{box-shadow:none}
.nx .art{width:40px;height:40px;justify-self:center}
.nx b{display:block;font-size:15px;line-height:20px;font-weight:600;color:var(--title);white-space:nowrap}
.nx small{display:block;font-size:12px;line-height:16px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx .tl{margin-right:-12px}
.f390 .tb{grid-template-columns:minmax(0,1fr) 72px;column-gap:12px;grid-template-areas:"info art" "bar bar" "nums nums" "act act" "nxt nxt"}
.f390 .tb>.art{width:56px;height:56px}
.f390 .tb{grid-template-columns:minmax(0,1fr) 56px}.f390 .tb.noart{grid-template-columns:minmax(0,1fr);grid-template-areas:"info" "bar" "nums" "act" "nxt"}
.f390 .tb-act{margin-top:16px;gap:8px}.f390 .tb-act .two{gap:12px}
.f390 .tb-amt{font-size:30px;line-height:36px}
.f390 .nx{grid-template-columns:32px minmax(0,1fr) 44px auto;column-gap:12px}.f390 .nx .art{width:32px;height:32px}.f390 .nx .ib{width:44px}

/* ── Карточка бонуса ── */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f820 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.f390 .grid{grid-template-columns:minmax(0,1fr)}
.grid.cut>.bc:nth-of-type(n+7){display:none}
.more{display:flex;justify-content:center;margin-top:16px}
.bc{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.bc-top{min-height:112px;padding:var(--pad);background:var(--grad);display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:end;box-shadow:inset 0 -1px 0 var(--line)}
.bc-top .tx{display:grid;gap:4px;min-width:0}
.bc-top .art{width:96px;height:96px;margin:-8px -8px -8px 0;align-self:center}
.bc.flat .bc-top{background:none}
.bc.hot{box-shadow:0 0 0 1px var(--selected)}
.bc-bd{padding:16px var(--pad) var(--pad);display:flex;flex-direction:column;gap:12px;flex:1}
.bc-name{font-size:14px;line-height:20px;font-weight:500;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f390 .bc-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.bc-act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-top:auto;min-height:var(--bh)}
.bc.locked .bc-top .art,.bc.dim .bc-top .art{filter:grayscale(.7) brightness(.7)}
.bc.dim .of b{color:var(--muted)}.bc.dim .of span{color:var(--muted)}
.lock{display:grid;gap:6px;font-size:12px;line-height:16px;color:var(--muted)}
.lock b{color:var(--selected);font-weight:500}
.f390 .bc-top{min-height:96px}.f390 .bc-top .art{width:80px;height:80px}
.f390 .bc-bd{padding-top:12px;gap:10px}

/* ── Приветственный пакет: заголовок секции + те же карточки на сетке каталога ── */
.wl-h{margin:40px 0 16px}
.wl-h h2{margin:4px 0 0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.48px;color:var(--title)}

/* ── Строка-радио (касса, регистрация) ── */
.opts{display:grid;gap:8px}
.opt{border-radius:12px;background:var(--card);box-shadow:var(--ring);padding:10px 8px 10px var(--pad);display:grid;grid-template-columns:18px 40px minmax(0,1fr) auto 40px;gap:12px;align-items:center;min-height:64px;position:relative}
.opt .hit{position:absolute;inset:0;border:0;background:none;border-radius:12px;padding:0}
.opt>*:not(.hit){position:relative;pointer-events:none}.opt>.ib{pointer-events:auto}
.opt .art{width:40px;height:40px}
.opt .t{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--title)}
.opt .d{display:flex;flex-wrap:wrap;column-gap:16px;font-size:12px;line-height:16px;color:var(--muted)}.opt .d span{white-space:nowrap}
.opt .v{font-size:17px;line-height:20px;font-weight:600;letter-spacing:-.3px;color:var(--title);white-space:nowrap;text-align:right}
.opt .v small{display:block;font-size:12px;line-height:16px;font-weight:400;letter-spacing:0;color:var(--muted)}
.opt.on{box-shadow:inset 0 0 0 1px var(--selected),0 0 0 3px rgba(163,132,217,.22)}
.opt.off .t,.opt.off .v{color:var(--muted)}.opt.off .art{filter:grayscale(.8) brightness(.7)}
.opt .d .bad{color:var(--red)}
.opt .t{overflow-wrap:anywhere}
.opt.none{grid-template-columns:18px minmax(0,1fr)}
.radio{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(150,144,171,.55);display:grid;place-items:center}
.radio.on{box-shadow:inset 0 0 0 1.5px var(--selected)}
.radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--selected)}
.f390 .opt{grid-template-columns:18px 32px minmax(0,1fr) auto 44px;gap:10px;padding-right:4px}
.f390 .opt .art{width:32px;height:32px}.f390 .opt.none{grid-template-columns:18px minmax(0,1fr)}.f390 .opt .ib{width:44px}

/* ── Диалог (новый компонент) ── */
.dlg-bg{position:absolute;inset:0;background:rgba(10,9,16,.55);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:96px 16px 16px;z-index:40}
.dlg-bg.on{display:flex}
.dlg{width:100%;max-width:440px;max-height:640px;border-radius:16px;background:#1a1822;box-shadow:0 0 0 1px rgba(233,233,237,.12),0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;position:relative}
.dlg-hd{padding:var(--pad);padding-right:60px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.dlg-hd .art{width:56px;height:56px}
.dlg-hd h3{margin:0;font-size:17px;line-height:24px;font-weight:600;color:var(--title)}
.dlg-hd .of b{font-size:24px;line-height:28px}
.dlg .x{position:absolute;right:10px;top:10px}
.dlg-bd{padding:0 var(--pad);overflow:auto;flex:1}
.dlg.more .dlg-ft{box-shadow:0 -1px 0 var(--line),0 -16px 16px -8px rgba(13,12,22,.7)}
.dlg-hd small{display:block;font-size:13px;line-height:20px;color:var(--muted);margin-top:2px}
.dlg-bd p{margin:0 0 8px;font-size:13px;line-height:20px;color:var(--muted)}
.dlg-ft{padding:var(--pad);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:16px;min-height:40px;align-items:center;border-top:1px solid var(--line);font-size:13px}
.kv span{color:var(--muted)}.kv b{font-weight:500;text-align:right;color:var(--text)}
.kv.in span{padding-left:16px}
.cx{padding:0 var(--pad)}.cx .kv:first-child{border-top:0}.cx .kv.big b{font-size:24px;line-height:32px;font-weight:600;color:var(--red)}
.f390 .dlg-bg{padding:0;align-items:flex-end}
.f390 .dlg{max-width:none;border-radius:16px 16px 0 0;max-height:540px}
.f390 .dlg-ft .btn{height:48px}

/* ── Тост, уведомления, история ── */
.toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);z-index:50;width:calc(100% - 32px);max-width:360px;display:grid;grid-template-columns:20px 1fr 40px;gap:12px;align-items:center;padding:8px 8px 8px 16px;border-radius:12px;background:#1F1D28;box-shadow:0 0 0 1px rgba(233,233,237,.12),0 16px 40px rgba(0,0,0,.45);font-size:14px;font-weight:500;color:var(--title)}
.toast .ok{color:var(--green);display:grid}
.f390 .toast{top:68px}
.ntf{position:absolute;top:76px;right:24px;width:400px;z-index:45;border-radius:16px;background:rgba(26,24,34,.97);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(233,233,237,.12),0 24px 60px rgba(0,0,0,.5);padding:12px}
.f390 .ntf{left:8px;right:8px;width:auto;top:60px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:32px;padding:0 12px;border-radius:999px;border:0;background:none;box-shadow:inset 0 0 0 1px rgba(233,233,237,.14);font-size:13px;color:var(--text);display:inline-flex;gap:6px;align-items:center}
.fchip.on{background:var(--selected);color:var(--dark);box-shadow:none;font-weight:500}
.nlist{margin-top:10px;border-radius:12px;background:rgba(233,233,237,.03);box-shadow:var(--ring);padding:0 12px}
.nitem{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nitem:first-child{border-top:0}
.nico{width:32px;height:32px;border-radius:50%;background:rgba(233,233,237,.06);display:grid;place-items:center;color:var(--muted)}.nico.g{color:var(--green)}
.nitem b{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--title)}
.nitem small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.nitem em{font-style:normal;font-size:15px;font-weight:600;color:var(--title);text-align:right}.nitem em.g{color:var(--green)}.nitem em small{font-weight:400}
.hist{padding:0 var(--pad)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px;gap:16px;align-items:center;min-height:64px;border-top:1px solid var(--line);font-size:14px}
.hrow:first-child{border-top:0}
.hrow.h{min-height:40px;font-size:11px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.hrow>:last-child{text-align:right}
.hrow b{display:block;font-weight:500;color:var(--title)}.hrow small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.hrow .a{font-weight:600;color:var(--muted)}.hrow .a.g{color:var(--green)}

.empty{display:grid;justify-items:center;gap:8px;padding:56px 16px;color:var(--muted);font-size:14px}

/* ── Гость, FAQ ── */
.gb{margin-top:24px;padding:var(--pad);display:grid;grid-template-columns:72px auto minmax(0,1fr) auto auto;column-gap:var(--pad);align-items:center}
.gb .art{width:72px;height:72px}

.f390 .gb{grid-template-columns:minmax(0,1fr) 56px;row-gap:12px}
.f390 .gb .art{width:56px;height:56px;grid-column:2;grid-row:1}.f390 .gb>.g1{grid-column:1;grid-row:1}
.f390 .gb .pairs{grid-column:1/-1;margin:0}.f390 .gb .ga{grid-column:1/-1}
.ga{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.faq{border-top:1px solid var(--line)}
.faq div{min-height:56px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:14px;font-weight:500;color:var(--title)}
.faq div span{color:var(--muted);font-size:18px;font-weight:300}

/* ── Касса и регистрация (каркас сайта) ── */
.cash{display:grid;grid-template-columns:minmax(0,1fr) 410px}
.f820 .cash,.f390 .cash{grid-template-columns:minmax(0,1fr)}
.cash-main{padding:8px 32px 56px;min-width:0}.f390 .cash-main{padding:8px 16px 40px}
.step{padding:28px 0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}
.step h3{margin:0 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:20px;font-weight:600;letter-spacing:-.4px;color:var(--title)}
.step h3>span:first-child{color:var(--primary);font-weight:500}
.segm{display:inline-flex;padding:3px;border-radius:999px;background:rgba(233,233,237,.05);box-shadow:var(--ring);margin-left:auto}
.segm span{height:28px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.segm span.on{background:#2a2536;color:var(--title)}
.cur{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.f390 .cur{grid-template-columns:repeat(2,minmax(0,1fr))}
.curc{border-radius:12px;box-shadow:var(--ring);background:var(--card);padding:12px;display:grid;gap:2px;font-size:12px}
.curc.on{box-shadow:0 0 0 1px var(--primary)}
.curc b{font-size:15px;font-weight:600;color:var(--title)}.curc>span{color:var(--muted);margin-bottom:6px}
.curc .r2{display:flex;justify-content:space-between;gap:8px}.curc .r2 span{color:var(--muted)}.curc .r2 em{font-style:normal;color:var(--text)}
.field{height:44px;border-radius:8px;background:rgba(233,233,237,.04);box-shadow:var(--ring);display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:600;color:var(--title)}
.amts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}.f390 .amts{grid-template-columns:repeat(3,minmax(0,1fr))}
.amts button{height:var(--bh);border-radius:8px;border:0;background:none;color:inherit;box-shadow:var(--ring);font-size:13px;font-weight:600}
.amts button.on{box-shadow:0 0 0 1px var(--primary);background:rgba(163,132,217,.12)}
.stub{font:12px/1.5 Inter,system-ui;color:#6b6680;border:1px dashed #3a3446;border-radius:8px;padding:10px 12px}
.cact{border-radius:12px;padding:10px 8px 14px var(--pad);margin-bottom:8px}
.cact .r{display:grid;grid-template-columns:18px 40px minmax(0,1fr) auto 40px auto;gap:12px;align-items:center;min-height:44px}
.cact .art{width:40px;height:40px}
.cact .t{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cact .d{display:block;font-size:12px;line-height:16px;color:var(--muted)}.cact .d i{font-style:normal;color:var(--green)}
.cact .v{font-size:17px;line-height:20px;font-weight:600;letter-spacing:-.3px;color:var(--title);white-space:nowrap}
.cact .bar{margin:10px 12px 0 0}
.f390 .cact .r{grid-template-columns:32px minmax(0,1fr) auto 44px;gap:10px}.f390 .cact .r>i{display:none}.f390 .cact .art{width:32px;height:32px}
.f390 .cact .tl{grid-column:1/-1;justify-self:start;margin-left:-12px}
.cact .r>i{width:18px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.f390 .sum{grid-template-columns:1fr}
.pay{padding:var(--pad)}.pay strong{display:block;font-size:30px;font-weight:600;letter-spacing:-.9px;color:var(--title);margin:4px 0 16px}
.srows{padding:0 var(--pad)}.srows .kv:first-child{border-top:0}
.kv.tot b{font-size:20px;font-weight:600;color:var(--title)}.kv b.bad{color:var(--red)}.kv b small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.ops{border-left:1px solid var(--line);padding:24px 16px}.f820 .ops,.f390 .ops{border-left:0;border-top:1px solid var(--line)}
.ops h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:600;color:var(--title)}
.ops h3 a{font-size:12px;font-weight:500;color:var(--selected)}
.ops .box{margin-top:12px;border-radius:12px;box-shadow:var(--ring);background:var(--card);padding:14px 16px;font-size:13px;color:var(--muted)}
.note1{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.reg{display:grid;grid-template-columns:400px minmax(0,1fr);gap:40px;padding:32px 32px 56px}
.f820 .reg,.f390 .reg{grid-template-columns:minmax(0,1fr)}.f390 .reg{padding:20px 16px 40px}
.reg .segm{margin:0}.segm span{white-space:nowrap}
.reg h1{margin:20px 0 6px;font-size:36px;font-weight:400;letter-spacing:-.9px;line-height:1.05;color:var(--title)}.f390 .reg h1{font-size:28px}
.reg .lead{font-size:13px;color:var(--muted);margin:0}
.fld label,.lbl{display:block;font-size:12px;line-height:16px;color:var(--muted);margin:14px 0 6px}
.fld div{height:44px;border-radius:8px;background:rgba(233,233,237,.04);box-shadow:var(--ring);display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--muted)}
.fld div.v{color:var(--text)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted);margin:16px 0}
.check i{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(150,144,171,.55);flex:none;margin-top:1px}
.reg-art{border-radius:16px;background:radial-gradient(60% 70% at 50% 45%,#3a2c5c 0%,#1a1626 60%,#121019 100%);box-shadow:var(--ring);min-height:640px;display:grid;place-items:center}
.reg-art .art{width:320px;height:320px}
.f820 .reg-art,.f390 .reg-art{display:none}

/* ── Лист «Ядро» ── */
.core{display:grid;gap:32px;margin-top:24px}.core>div{min-width:0}
.core h5{margin:0 0 12px;font:600 11px/1.4 Inter,system-ui;letter-spacing:.06em;text-transform:uppercase;color:#6b6680}
.core table{width:100%;border-collapse:collapse;font-size:13px}
.core td,.core th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.core th{font-size:11px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.core td:first-child{color:var(--title);font-weight:500}
.core .y{color:var(--green)}.core .n{color:var(--muted2)}
.tw{overflow:auto}
.sizes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;align-items:start}
.f820 .sizes,.f390 .sizes{grid-template-columns:minmax(0,1fr)}
.sizes>div{display:grid;gap:12px}

.hrow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:20px}
.f820 .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.f820 .grid.three .bc-top .art{width:64px;height:64px;margin:0}
.f820 .grid.three .bc-top,.f820 .grid.three .bc-bd{padding-left:16px;padding-right:16px}

/* ═════════ v14 · компоненты. Поверх каркаса сайта (base.css) ═════════ */
:root{--glow:0 8px 28px -10px rgba(163,132,217,.65);--hl:inset 0 1px 0 rgba(255,255,255,.05);
  --logo:linear-gradient(180deg,#D9C8FF 0%,#A47BFF 55%,#8A5CF0 100%);--solid:#1B1924;--perf:rgba(233,233,237,.16)}
.rhero h1,.sh,.wl-h h2,.reg h1,.step h3{font-weight:700;letter-spacing:-.03em}
.sh{margin:48px 0 16px}.wl-h{margin:48px 0 16px}.f390 .sh,.f390 .wl-h{margin-top:40px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 40%),var(--card);box-shadow:var(--ring),var(--hl)}
.panel.acc{background:var(--grad);box-shadow:var(--ring-acc),var(--hl)}
.art{filter:drop-shadow(0 10px 22px rgba(124,77,255,.38))}

/* Шапка раздела: баннер справа, иконки у всех вкладок, как на живом сайте */
.rhero{position:relative;background:#14121c}
.rhero .pic{position:absolute;right:0;top:0;height:calc(100% - 45px);width:62%;background-size:cover;background-position:right center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%);mask-image:linear-gradient(90deg,transparent 0%,#000 55%);pointer-events:none}
.rhero .in,.rhero .tabs{position:relative}.rhero .in{padding-top:32px;padding-bottom:28px}
.rhero h1{margin:0}
.f390 .rhero .pic{width:100%;opacity:.45}
.tabs span svg{width:16px;height:16px}
.f390 .tabs{display:flex;flex-wrap:wrap;overflow:visible;padding:0 4px}
.f390 .tabs span{height:40px;padding:0 10px;font-size:12px}

/* ── Кнопки: вторичная = «Войти» живого сайта. Прозрачных текстовых кнопок нет ── */
.btn.s{background:rgba(233,233,237,.03);box-shadow:inset 0 0 0 1.5px rgba(150,144,171,.32);color:var(--text)}
@media (hover:hover){.btn.s:hover{background:rgba(233,233,237,.07);box-shadow:inset 0 0 0 1.5px rgba(198,171,252,.5)}}
.btn.s.red{color:var(--red)}
.btn.p.glow{box-shadow:var(--glow)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.4;cursor:default;box-shadow:none}
.sq{width:var(--bh);min-width:var(--bh);padding:0}
.btn.sm{--bh:36px;height:36px;font-size:13px;padding:0 14px}.btn.sm.sq{padding:0;width:36px;min-width:36px}
.f390 .btn.sm,.f820 .btn.sm{--bh:44px;height:44px}.f390 .btn.sm.sq,.f820 .btn.sm.sq{width:44px;min-width:44px}

/* ── Сумма: число и единица отдельно, кегль по длине числа, один на ряд ── */
.of{display:grid;min-width:0}
.of b{display:flex;align-items:baseline;gap:.2em;font-size:32px;line-height:36px;font-weight:700;letter-spacing:-.04em;color:var(--title);white-space:nowrap}
.of b span{font-size:inherit;line-height:inherit;font-weight:inherit;color:inherit;min-height:0;letter-spacing:inherit}
.of b .u{font-size:.5em;font-weight:600;letter-spacing:0;color:var(--selected)}
.of>span{font-size:13px;line-height:20px;font-weight:600;color:var(--selected);white-space:nowrap;min-height:20px}
[data-z="2"] .of b,.of.z2 b{font-size:28px}[data-z="3"] .of b,.of.z3 b{font-size:24px}[data-z="4"] .of b,.of.z4 b{font-size:21px}

/* ── Купон: настоящие вырезы маской, обводка повторяет контур ── */
.cw{--st:rgba(233,233,237,.10);--ny:136px;position:relative;min-width:0;
  filter:drop-shadow(1px 0 0 var(--st)) drop-shadow(-1px 0 0 var(--st)) drop-shadow(0 1px 0 var(--st)) drop-shadow(0 -1px 0 var(--st));transition:transform .18s ease}
.f390 .cw{--ny:120px}
.bc{display:flex;flex-direction:column;height:100%;border-radius:16px;overflow:hidden;background:var(--solid);
  -webkit-mask:radial-gradient(circle 10px at 0 var(--ny),#0000 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny),#0000 9.5px,#000 10px) right/51% 100% no-repeat;
  mask:radial-gradient(circle 10px at 0 var(--ny),#0000 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny),#0000 9.5px,#000 10px) right/51% 100% no-repeat}
.bc-top{position:relative;height:var(--ny);flex:none;padding:var(--pad);display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:end;
  background:radial-gradient(180px 140px at 85% 45%,rgba(163,132,217,.24),transparent 70%),var(--grad)}
.bc-top::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:repeating-linear-gradient(90deg,var(--perf) 0 6px,transparent 6px 12px)}
.bc-top .tx{display:grid;gap:6px;min-width:0;align-self:stretch;align-content:space-between}
.bc-top .art{width:112px;height:112px;margin:-10px -10px -12px 0;align-self:center;transition:transform .25s ease}
.f390 .bc-top .art{width:92px;height:92px}
.bc-bd{padding:16px var(--pad) var(--pad);display:flex;flex-direction:column;gap:14px;flex:1}
.bc-name{font-size:15px;line-height:20px;font-weight:600;color:var(--title);min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rows{display:grid;gap:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;line-height:20px}
.row span{color:var(--muted)}.row b{font-weight:600;color:var(--text);white-space:nowrap}
.bc-act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;margin-top:auto;min-height:var(--bh)}
.bc-act .st{padding-left:4px}
@media (hover:hover){
  .cw.live:hover{--st:rgba(198,171,252,.55);transform:translateY(-2px)}
  .cw.live:hover .bc-top .art{transform:scale(1.05) rotate(-2deg)}
}
.cw.hot{--st:var(--selected)}
.cw.dim .bc-top,.cw.lock .bc-top{background:linear-gradient(120deg,#221e2e,#18161f)}
.cw.dim .bc-top .art,.cw.lock .bc-top .art{filter:grayscale(.55) brightness(.62)}
.cw.dim .of b,.cw.dim .of span{color:var(--muted)}.cw.dim .of b .u{color:var(--muted)}
.cw.dim{--st:rgba(233,233,237,.06)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f820 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.f390 .grid{grid-template-columns:minmax(0,1fr)}
.grid.cut>.cw:nth-of-type(n+7){display:none}
.lbl1{display:flex;align-items:center;gap:5px;height:16px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;color:var(--selected);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl1 svg{width:12px;height:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:20px;font-weight:500;color:var(--muted);white-space:nowrap}
.st.g{color:var(--green)}.st svg{width:16px;height:16px}
.lock{display:grid;gap:6px;font-size:12px;line-height:16px;color:var(--muted)}.lock b{color:var(--selected);font-weight:500}

/* ── Активный бонус ── */
.tb{margin-top:24px;padding:var(--pad);display:grid;grid-template-columns:72px minmax(0,1fr) 220px;column-gap:var(--pad);align-items:center;
  grid-template-areas:"art info act" "bar bar bar" "nums nums nums" "nxt nxt nxt";position:relative;overflow:hidden;
  background:radial-gradient(260px 200px at 56px 56px,rgba(163,132,217,.30),transparent 70%),radial-gradient(600px 260px at 100% 0%,rgba(124,92,214,.16),transparent 70%),var(--grad)}
.tb>.art{grid-area:art;width:72px;height:72px}
.tb.noart{grid-template-columns:minmax(0,1fr) 220px;grid-template-areas:"info act" "bar bar" "nums nums" "nxt nxt"}
.tb-info{grid-area:info;min-width:0}
.tb-amt{display:flex;align-items:baseline;gap:.2em;font-weight:700;font-size:44px;line-height:48px;letter-spacing:-.045em;white-space:nowrap}
.tb-amt .n{background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent}
.tb-amt .u{font-size:.45em;font-weight:600;letter-spacing:0;color:var(--selected)}
.tb-amt.z2{font-size:36px}.tb-amt.z3{font-size:30px}.tb-amt.z4{font-size:26px}
.tb-name{font-size:14px;line-height:20px;font-weight:500;color:var(--text);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-act{grid-area:act;display:grid;gap:8px}
.tb-act .two{display:grid;grid-template-columns:auto 1fr;gap:8px}
.tb>.bar{grid-area:bar;margin-top:24px;height:10px;background:rgba(233,233,237,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.bar i{position:relative;background:linear-gradient(90deg,#8A5CF0,#A384D9 45%,#C6ABFC)}
.tb>.bar i{box-shadow:0 0 14px rgba(163,132,217,.6)}
.tb-nums{grid-area:nums;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:10px;font-size:13px;line-height:20px;color:var(--muted)}
.tb-nums b{color:var(--title);font-weight:600}.tb-nums .soon{color:var(--red);font-weight:600}
.nxt{grid-area:nxt;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.nxt .eyebrow{color:var(--muted);display:block;margin-bottom:4px}
.nx{display:grid;grid-template-columns:72px minmax(0,1fr) auto;column-gap:var(--pad);align-items:center;min-height:64px;padding:8px 0;box-shadow:inset 0 1px 0 var(--line)}
.nx:first-of-type{box-shadow:none}
.nx .art{width:44px;height:44px;justify-self:center}
.nx b{display:flex;gap:.25em;align-items:baseline;font-size:15px;line-height:20px;font-weight:700;color:var(--title);white-space:nowrap}
.nx b .u{font-size:12px;font-weight:600;color:var(--selected)}
.nx small{display:block;font-size:12px;line-height:16px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:8px;justify-content:flex-end}
.f390 .tb{grid-template-columns:minmax(0,1fr) 56px;column-gap:12px;grid-template-areas:"info art" "bar bar" "nums nums" "act act" "nxt nxt"}
.f390 .tb.noart{grid-template-columns:minmax(0,1fr);grid-template-areas:"info" "bar" "nums" "act" "nxt"}
.f390 .tb>.art{width:56px;height:56px}
.f390 .tb-amt{font-size:36px;line-height:42px}.f390 .tb-amt.z2{font-size:30px}.f390 .tb-amt.z3,.f390 .tb-amt.z4{font-size:24px}
.f390 .tb-act{margin-top:16px}.f390 .tb-act .btn.p{height:48px}
.f390 .nx{grid-template-columns:32px minmax(0,1fr) auto;column-gap:12px}.f390 .nx .art{width:32px;height:32px}
.f390 .nx .acts .btn:not(.sq){padding:0 12px}

/* ── Гость ── */
.gb{margin-top:24px;padding:var(--pad);display:grid;grid-template-columns:72px minmax(0,1fr) auto;column-gap:var(--pad);align-items:center;
  background:radial-gradient(240px 200px at 56px 50%,rgba(163,132,217,.3),transparent 70%),var(--grad)}
.gb .art{width:72px;height:72px}
.gb .of b{font-size:40px;line-height:44px}.gb .of b .n{background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent}
.gb .gr{display:flex;gap:24px;align-items:center}
.gb .rows{min-width:140px}
.f390 .gb{grid-template-columns:minmax(0,1fr) 56px;row-gap:16px}.f390 .gb .art{width:56px;height:56px;grid-column:2;grid-row:1}
.f390 .gb>.g1{grid-column:1;grid-row:1}.f390 .gb .gr{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:8px}
.f390 .gb .gr .rows{grid-column:1/-1}

/* ── Плитка выбора: мини-купон для кассы и регистрации ── */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f390 .tiles,.reg .tiles{grid-template-columns:minmax(0,1fr)}
.tw2{--st:rgba(233,233,237,.10);position:relative;min-width:0;filter:drop-shadow(1px 0 0 var(--st)) drop-shadow(-1px 0 0 var(--st)) drop-shadow(0 1px 0 var(--st)) drop-shadow(0 -1px 0 var(--st))}

.tile{position:relative;display:grid;grid-template-columns:80px minmax(0,1fr) auto;min-height:84px;border-radius:12px;background:var(--solid);cursor:pointer;
  -webkit-mask:radial-gradient(circle 8px at 80px 0,#0000 7.5px,#000 8px) top/100% 51% no-repeat,radial-gradient(circle 8px at 80px 100%,#0000 7.5px,#000 8px) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 8px at 80px 0,#0000 7.5px,#000 8px) top/100% 51% no-repeat,radial-gradient(circle 8px at 80px 100%,#0000 7.5px,#000 8px) bottom/100% 51% no-repeat}
.tile .stub{display:grid;place-items:center;background:radial-gradient(60px 60px at 50% 50%,rgba(163,132,217,.25),transparent 70%),var(--grad);position:relative}
.tile .stub::after{content:"";position:absolute;right:0;top:12px;bottom:12px;width:1px;background:repeating-linear-gradient(180deg,var(--perf) 0 5px,transparent 5px 10px)}

.tile .v{display:flex;gap:.25em;align-items:baseline;font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.03em;color:var(--title);white-space:nowrap}

/* Активный бонус в кассе: полоса статуса, не вариант выбора */

  background:radial-gradient(200px 120px at 40px 50%,rgba(163,132,217,.22),transparent 70%),var(--grad);box-shadow:var(--ring-acc),var(--hl)}

.cst .t{display:block;font-size:13px;line-height:18px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cst .v{display:flex;gap:.25em;align-items:baseline;font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}

.f390 .cst .acts{grid-column:1/-1;margin-top:12px;justify-content:stretch}.f390 .cst .acts .btn:not(.sq){flex:1}

/* Итог кассы */

.kv.tot b{font-weight:700}.kv b.bad{color:var(--red)}
.kv b{white-space:nowrap}

/* Регистрация */
.reg-art{background:radial-gradient(50% 55% at 50% 48%,rgba(163,132,217,.35) 0%,rgba(58,44,92,.35) 45%,#121019 100%)}

.reg .lbl{margin-top:20px}

/* ── Окна: привязаны к экрану ── */
.dlg-bg{position:fixed;inset:0 auto 0 0;background:rgba(8,7,12,.66);backdrop-filter:blur(6px);padding:72px 16px 16px;z-index:80}
.f390 .dlg-bg{backdrop-filter:none;background:rgba(8,7,12,.72);padding:0}
.dlg{background:var(--solid);box-shadow:0 0 0 1px rgba(233,233,237,.12),0 30px 80px rgba(0,0,0,.6);max-height:min(720px,calc(100vh - 96px));overflow:hidden}

.dlg-ft{padding:16px var(--pad) var(--pad);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.dlg-ft .btn{height:44px}.f390 .dlg-ft .btn{height:48px}
.dlg.more .dlg-ft{box-shadow:0 -1px 0 var(--line),0 -16px 16px -8px rgba(13,12,22,.7)}
/* Условия: шапка = верх купона */
.dlg.terms{max-width:480px;--ny:144px;
  -webkit-mask:radial-gradient(circle 10px at 0 var(--ny),#0000 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny),#0000 9.5px,#000 10px) right/51% 100% no-repeat;
  mask:radial-gradient(circle 10px at 0 var(--ny),#0000 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny),#0000 9.5px,#000 10px) right/51% 100% no-repeat}
.f390 .dlg.terms{--ny:128px;-webkit-mask:none;mask:none}
.th{position:relative;height:var(--ny);flex:none;padding:var(--pad);padding-right:132px;display:grid;align-content:end;gap:6px;
  background:radial-gradient(200px 150px at 88% 50%,rgba(163,132,217,.26),transparent 70%),var(--grad)}
.th::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:repeating-linear-gradient(90deg,var(--perf) 0 6px,transparent 6px 12px)}

.dlg-bd{padding:16px var(--pad) 4px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}
.dlg-bd p.desc{margin:0;font-size:14px;line-height:22px;color:#C9C6D6}
.grp .eyebrow{color:var(--muted);display:block;margin:0 0 6px}
.grp .box{border-radius:12px;background:rgba(233,233,237,.03);box-shadow:inset 0 0 0 1px rgba(233,233,237,.06);padding:0 14px}
.grp .kv{min-height:40px;border-top:1px solid var(--line)}.grp .kv:first-child{border-top:0}
.gm{padding:9px 0;border-top:1px solid var(--line);display:grid;gap:6px}.gm:first-child{border-top:0}
.gm .l{display:flex;justify-content:space-between;font-size:13px;line-height:18px}.gm .l span{color:var(--text)}.gm .l b{font-weight:600}
.gm .l b.z{color:var(--muted2)}
.gm .bar{height:3px}.gm .bar i{box-shadow:none}
/* Отмена */
.dlg.cancel{max-width:400px}
.dlg.cancel .hd{padding:var(--pad);padding-right:60px}
.dlg.cancel h3{margin:0;font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.02em;color:var(--title)}
.cxp{margin:0 var(--pad);border-radius:12px;background:rgba(233,233,237,.03);box-shadow:inset 0 0 0 1px rgba(233,233,237,.06);padding:12px 16px 12px 12px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}

/* Тост: внизу экрана */
.toast{position:fixed;top:auto;bottom:24px;transform:translateX(-50%);z-index:90;background:rgba(31,29,40,.94);backdrop-filter:blur(12px)}

/* Уведомления: не заходят на чат */
.ntf{right:434px;box-shadow:0 0 0 1px rgba(233,233,237,.12),0 30px 80px rgba(0,0,0,.55),var(--hl)}
.f820 .ntf{right:24px}
.nitem em{font-style:normal;font-size:15px;font-weight:600;color:var(--title);text-align:right;white-space:nowrap}.nitem em.g{color:var(--green)}.nitem em.z{color:var(--muted2)}
.nitem em small{font-weight:400}
.fchip{cursor:pointer}

/* История: статус у суммы */
.hrow{grid-template-columns:minmax(0,1fr) auto}

/* FAQ: рабочий аккордеон, как на сайте */
.faq{border-top:1px solid var(--line)}

  font-size:14px;font-weight:500;color:var(--title);text-align:left;padding:0}
.faq .q i{font-style:normal;color:var(--muted);font-size:20px;font-weight:300;transition:transform .15s}
.faq .q[aria-expanded=true] i{transform:rotate(45deg)}
.faq .a{display:none;padding:12px 0 16px;border-bottom:1px solid var(--line);font-size:14px;line-height:22px;color:var(--muted)}
.faq .q[aria-expanded=true]+.a{display:block}

/* Лист «Ядро» */
.core .tw{overflow:auto}

/* Движение: только первое появление. Выключается системной настройкой */
@media (prefers-reduced-motion:no-preference){
  .first .cw,.first .tb,.first .gb{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
  .first .grid .cw:nth-child(2){animation-delay:.05s}.first .grid .cw:nth-child(3){animation-delay:.1s}
  .first .tb>.bar i{animation:fill .9s .15s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.th .art{top:auto;bottom:6px;right:20px;transform:none;width:96px;height:96px}
.f390 .th .art{width:80px;height:80px;right:12px}
.f390 .hrow{grid-template-columns:minmax(0,1fr) auto}.f390 .hrow>.r{grid-column:2;grid-row:1}
.empty svg{width:20px;height:20px}
.tw2>input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.tw2:focus-within{--st:var(--selected)}
.f390 .th{height:auto;min-height:128px;padding-top:44px}

/* ═════════ v15 · правки по 18 замечаниям и четырём ревью ═════════ */
/* Широкие экраны: макет показывает 1920 и 2560 */
.frame[data-w="1920"]{width:1920px}.frame[data-w="2560"]{width:2560px}
/* Токены живого сайта: заголовки и суммы не жирнее сайта */
.rhero h1{font-weight:400;letter-spacing:-.9px}
.sh,.wl-h h2{font-weight:600;letter-spacing:-.48px}
.of b{font-size:30px;font-weight:600;letter-spacing:-.9px}
[data-z="2"] .of b{font-size:26px}[data-z="3"] .of b{font-size:22px}[data-z="4"] .of b{font-size:18px}
.of b .u{font-size:.5em;min-width:0}
.cz{font-size:.62em;vertical-align:-.25em;font-weight:600;margin:0 .04em;color:inherit}

/* ── Сетка: колонки по ширине, максимум 6, «ещё» после двух рядов ── */
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.f1920 .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
.f2560 .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid.cut>.cw:nth-of-type(n){display:flex}.grid.cut>.cw.hid:nth-of-type(n){display:none}
.f820 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.f390 .grid{grid-template-columns:minmax(0,1fr)}
.grid.wide1{grid-template-columns:minmax(0,1fr)}
.sh .cnt{font-size:15px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.faq,.how{max-width:1220px}

/* ── Купон: метка: чип в углу, как «Первый депозит» на живой карточке ── */
.bc-top{grid-template-columns:minmax(0,1fr) auto;align-items:end;position:relative}
.bc-top .tx{display:block;align-self:end}
.chip2{position:absolute;left:12px;top:12px;z-index:2;max-width:calc(100% - 24px);height:22px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;
  background:rgba(13,12,22,.55);box-shadow:inset 0 0 0 1px rgba(233,233,237,.10);backdrop-filter:blur(8px);font-size:11px;line-height:16px;font-weight:600;letter-spacing:.2px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip2 svg{width:12px;height:12px;flex:none}.chip2.lv{color:var(--selected)}
.f390 .chip2{left:10px;top:10px;max-width:calc(100% - 20px)}
.bc-top .art{width:100px;height:100px;align-self:end;margin:0 -8px -16px 0}
.f390 .bc-top .art{width:84px;height:84px;margin:0 -6px -12px 0}
.bc-bd{gap:12px}
.bc-name{min-height:0}
.rows{margin-top:auto}
.bc-act{margin-top:0}
.cw{display:flex}.cw>.bc{flex:1}

/* ── Широкий купон: бонус за регистрацию у гостя ── */
.cw.wide{--nx:313px}
.cw.wide .bc{flex-direction:row;
  -webkit-mask:radial-gradient(circle 10px at var(--nx) 0,#0000 9.5px,#000 10px) top/100% 51% no-repeat,radial-gradient(circle 10px at var(--nx) 100%,#0000 9.5px,#000 10px) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 10px at var(--nx) 0,#0000 9.5px,#000 10px) top/100% 51% no-repeat,radial-gradient(circle 10px at var(--nx) 100%,#0000 9.5px,#000 10px) bottom/100% 51% no-repeat}
.cw.wide .bc-top{width:var(--nx);height:auto;min-height:136px}
.cw.wide .bc-top::after{left:auto;right:0;top:16px;bottom:16px;width:1px;height:auto;background:repeating-linear-gradient(180deg,var(--perf) 0 6px,transparent 6px 12px)}
.cw.wide .bc-bd{flex-direction:row;align-items:center;gap:24px}
.cw.wide .bc-bd>div:first-child{flex:1;display:grid;gap:10px;min-width:0}
.cw.wide .bc-act{min-width:220px;grid-template-columns:auto 1fr}
.f820 .cw.wide{--nx:300px}
.f390 .cw.wide .bc{flex-direction:column;-webkit-mask:radial-gradient(circle 10px at 0 var(--ny),#0000 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny),#0000 9.5px,#000 10px) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 var(--ny),#0000 9.5px,#000 10px) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% var(--ny),#0000 9.5px,#000 10px) right/51% 100% no-repeat}
.f390 .cw.wide .bc-top{width:auto;height:var(--ny);min-height:0}
.f390 .cw.wide .bc-top::after{left:16px;right:16px;top:auto;bottom:0;width:auto;height:1px;background:repeating-linear-gradient(90deg,var(--perf) 0 6px,transparent 6px 12px)}
.f390 .cw.wide .bc-bd{flex-direction:column;align-items:stretch;gap:12px}
.f820 .cw.wide .bc-act{min-width:0;grid-template-columns:auto 160px}
.f390 .cw.wide .bc-bd>div:first-child{display:block}.f390 .cw.wide .bc-bd>div:first-child .rows{margin-top:12px}
.gsec{margin-top:24px}

/* ── Активный бонус: кольцо прогресса вокруг арта, как кольцо живого блока ── */
.tb{grid-template-columns:168px minmax(0,1fr) 220px;column-gap:28px;grid-template-areas:"ring info act" "nxt nxt nxt";align-items:center;padding:24px}
.tb.noart{grid-template-columns:168px minmax(0,1fr) 220px;grid-template-areas:"ring info act" "nxt nxt nxt"}
.ring{grid-area:ring;position:relative;width:168px;height:168px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:rgba(233,233,237,.08)}.ring .pr{stroke:url(#rg);stroke-linecap:round}
.ring .art{width:118px;height:118px;filter:drop-shadow(0 12px 28px rgba(124,77,255,.55))}
.ring .pc{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);height:24px;padding:0 9px;border-radius:12px;background:#221d31;box-shadow:inset 0 0 0 1px rgba(198,171,252,.35);font-size:12px;line-height:24px;font-weight:600;color:var(--selected);white-space:nowrap}

.tb-nums .soon{color:var(--selected);font-weight:600}
.tb>.bar{display:none}
.f820 .tb{grid-template-columns:136px minmax(0,1fr);grid-template-areas:"ring info" "act act" "nxt nxt";row-gap:16px}
.f820 .ring{width:136px;height:136px}.f820 .ring .art{width:96px;height:96px}
.f820 .tb-act{grid-template-columns:1fr auto;align-items:center}
.f390 .tb,.f390 .tb.noart{grid-template-columns:96px minmax(0,1fr);grid-template-areas:"ring info" "act act" "nxt nxt";column-gap:16px;row-gap:16px;padding:16px}
.f390 .ring{width:96px;height:96px}.f390 .ring .art{width:66px;height:66px}.f390 .ring .pc{height:20px;line-height:20px;font-size:11px;padding:0 7px;bottom:-6px}
.f390 .tb-act{margin-top:0}
.f390 .tb-nums{flex-direction:column;gap:2px;font-size:12px;line-height:18px}

/* «Следующие»: строка 64, название читаемое; на телефоне две линии */
.nx{grid-template-columns:48px minmax(0,1fr) auto;min-height:64px}
.nx .art{width:48px;height:48px}
.nx small{font-size:13px;line-height:18px;color:var(--text);font-weight:500}
.nx small.dt{font-size:12px;line-height:16px;color:var(--muted);font-weight:400}

.f390 .nx .acts .btn:not(.sq){flex:1}

/* ── Плитка выбора: колонка справа в ряд, ровные зазоры, одна высота ── */
.tile{grid-template-columns:80px minmax(0,1fr) auto;min-height:88px}
.tile .side{display:flex;flex-direction:row;align-items:center;gap:12px;padding:0 16px 0 8px;grid-template-rows:none}
.tile .side .chk{order:2}
.tile .bd{padding:12px 4px 12px 16px}

/* Сумма приходит строкой с точностью валюты. Здесь её имитирует пересчёт.
   Правила: только отбрасываем лишние знаки (никогда не округляем вверх), положительное никогда не становится 0,

function num(n,c=CUR){const C=CURS[c];let v=n*C.rate;

  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,NB);

  if(i==="0"&&/^0{3,}/.test(f)){const z=f.match(/^0+/)[0];return `<span class="lz">0,${z}</span>${f.slice(z.length)}`}
  return f?i+","+f:i}

  if(get.length) g.push(["Как получить",get.join("")]);

  if(b.mult&&b.type==="fix") w.push(kv("Поставить",m(b.val*b.mult),"Сумма бонуса × вейджер"));
  if(b.mult&&per(b)) w.push(kv("Срок",per(b)+" с получения","Срок отыгрыша, часы"));
  g.push(["Как отыграть",w.join("")]);
  if(b.mult){const cats=b.cats?[...b.cats,["Остальные игры",b.others?100:0]]:[["Все игры",100]];
    g.push(["Какие ставки идут в отыгрыш",`<div class="gh"><span>Игра</span><span>Идёт в отыгрыш</span></div>`+cats.map(([n,p])=>`<div class="gm" data-f="Зачёт по категориям (новое)"><div class="l"><span>${n}</span><b class="${p?"":"z"}">${p?p+NB+"%":"не идут"}</b></div>${p?`<div class="bar"><i style="width:${p}%"></i></div>`:""}</div>`).join("")]);}
  const pay=[]; if(b.maxBet) pay.push(kv("Ставка","до "+m(b.maxBet),"Макс. ставка (новое): ставка больше засчитывается как эта сумма"));
  if(b.maxWin) pay.push(kv("Выигрыш","до "+m(b.maxWin),"Макс. выигрыш (новое), смысл: B22"));
  if(pay.length) g.push(["Ставка и выигрыш",pay.join("")]);
  return g.map(([t,h])=>`<div class="grp"><span class="eyebrow">${t}</span><div class="box">${h}</div></div>`).join("");
}
/* Дровер как на сайте (панель «Бонусы» у колокольчика): справа сверху, заголовок отдельной плашкой, ниже содержимое. На телефоне снизу */
function showDlg(html,focusSel,title){const d=document.getElementById("dlg");d.innerHTML=`<div class="drw">${title?`<div class="drw-h">${title}</div>`:""}${html}</div>`;
  const fr=document.getElementById("frame"),r=fr.getBoundingClientRect(); d.style.left=r.left+"px"; d.style.width=r.width+"px";
  const ph=fr.classList.contains("f390");
  d.style.display="flex"; d.style.justifyContent=ph?"center":"flex-end"; d.style.alignItems=ph?"flex-end":"flex-start";
  const g=d.querySelector(".dlg"),sc=g.querySelector(".scroll");
  if(sc){const f=()=>g.classList.toggle("more",sc.scrollHeight-sc.scrollTop-sc.clientHeight>2);sc.onscroll=f;f()}
  window.__opener=document.activeElement; (g.querySelector(focusSel||".dlg-ft .btn.p")||g.querySelector("button")).focus({preventScroll:true}); fitAll();}
/* Фокус не уходит из окна */
document.addEventListener("keydown",e=>{const d=document.getElementById("dlg");if(e.key!=="Tab"||!d||d.style.display!=="flex")return;
  const f=[...d.querySelectorAll("button,a")].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;
  const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDlg();closeNtf()}});
function openTerms(k,ctx){
  const b=B[k], close=`<button class="btn s" onclick="closeDlg()">Закрыть</button>`, take=ctx!=="view"&&!b.future;
  const foot=ctx==="pick"?close+`<button class="btn p" onclick="closeDlg();pickOpt('${k}')">Выбрать</button>`
    :ctx==="reg"?close+`<button class="btn p" onclick="closeDlg();setReg('reg')">Выбрать</button>`
    :!take?close:close+`<button class="btn p" onclick="closeDlg();${ctx==="guest"?(k==="reg"?"go('reg','reg')":"go('reg')"):`getBonus('${k}')`}">Получить</button>`;
  showDlg(`<div class="dlg terms" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="scroll">
    <div class="th ${b.art?"":"noart"}">${art(b)}${label(b,!fits(b),false)}<div class="of"><b>${amtH(b)}</b><span>${cap(b)}</span></div><h3 id="dt" data-f="Название">${b.name}</h3></div>
    <div class="dlg-bd">${b.desc?`<p class="desc" data-f="Описание (простой текст из админки)">${b.desc}</p>`:""}${termGroups(b)}${take?`<p class="consent" data-f="Правила бонусов (версия)">Нажимая «Получить», вы принимаете условия бонуса и Правила бонусной программы.</p>`:""}</div></div>
    <div class="dlg-ft" ${take?"":`style="grid-template-columns:1fr"`}>${foot}</div></div>`,".dlg-ft .btn.s","Условия бонуса");
}
/* Отмена: строки последствий, как группа в условиях. Без «сгорит» и без красной суммы */
function openCancel(k){
  const a=PB[k], act=ST.act===k, nx=act&&ST.queue[0];
  const kv=(l,v,c="")=>`<div class="kv"><span>${l}</span><b class="${c}">${v}</b></div>`;
  showDlg(`<div class="dlg cancel" role="dialog" aria-modal="true" aria-label="Отменить бонус?">
    <div class="cxb">${art(B[k])||"<span></span>"}<div style="min-width:0"><div class="t" data-f="Название">${B[k].name}</div><div class="v" data-fit data-f="Сумма бонуса">${mh(a.amt)}</div></div></div>
    <div class="cxr">${kv("Бонусный баланс","−"+m(a.amt))}${a.done?kv("Отыграно",`${m(a.done)} из ${m(a.need)}`):""}${kv("Ваш баланс не изменится",ST.zero?m(0):m(215),"g")}</div>
    <div class="dlg-ft"><button class="btn s red" onclick="doCancel('${k}')">Отменить бонус</button><button class="btn p" onclick="closeDlg()">Оставить</button></div></div>`,null,"Отменить бонус?");
}
function doCancel(k){
  const wasAct=ST.act===k;
  if(wasAct) ST.act=ST.queue.shift()||null; else ST.queue=ST.queue.filter(x=>x!==k);
  ST.gone.push(k); ST.soon=false; closeDlg(); draw();
  TOAST=wasAct&&ST.act?`Бонус отменён. Отыгрывается: ${B[ST.act].name}`:"Бонус отменён";
  document.body.insertAdjacentHTML("beforeend",toast());
  const t=document.getElementById("toast"), fr=document.getElementById("frame"), r=fr.getBoundingClientRect(); t.style.left=(r.left+r.width/2)+"px";
  if(fr.classList.contains("f390")) t.classList.add("top");
  clearTimeout(window.__t); window.__t=setTimeout(()=>document.getElementById("toast")?.remove(),4000);
}
function closeDlg(){const d=document.getElementById("dlg"); if(d&&d.style.display==="flex"){d.style.display="none";window.__opener?.focus?.({preventScroll:true})}}
function toggleNtf(){const n=document.getElementById("ntf"); if(n) n.remove(); else{document.querySelector("#frame .shell")?.insertAdjacentHTML("afterend",ntf())}}
function closeNtf(){document.getElementById("ntf")?.remove()}
document.addEventListener("click",e=>{const n=document.getElementById("ntf"); if(n&&!e.composedPath().some(x=>x.id==="ntf"||x.id==="states"||x.classList?.contains("bell"))) n.remove()});
/* Телефон: вместо трёх рядов вкладок: один выбор раздела, список открывается снизу */
function openSections(tab,guest){
  showDlg(`<div class="dlg secs" role="dialog" aria-modal="true" aria-label="Разделы"><div class="sl">${TABS.filter(([n])=>!(guest&&n==="История")).map(([n,ic])=>`<button class="${n===tab?"on":""}" onclick="closeDlg();${n==="История"?"go('hist')":n==="Бонусы"?"go('main')":""}">${ic}<span>${n}</span>${n===tab?I.tick:""}</button>`).join("")}</div></div>`,".sl .on","Награды");
}
function getBonus(k){go("cashpick",k)}

/* ── Лист «Ядро» ── */
const coreSheet=()=>{CASH={A:50,sel:"fri",keys:["fri"],crypto:false};
  const Y='<td class="y">да</td>',N='<td class="n">условия</td>',X='<td class="n">нет</td>';
  return site(`<div class="core">
  <div><h5>Одно ядро, три размера</h5><div class="sizes">${card(B.fri)}<div>
    <div class="tiles" style="grid-template-columns:1fr">${tile("fri")}</div>
    <div class="panel" style="padding:0 var(--pad)">${nxRow("fri")}</div>
    ${hist()}</div></div></div>
  <div><h5>Где игрок видит каждое поле админки</h5><div class="tw"><table><tr><th>Поле в админке</th><th>Где видно</th></tr><tr><td>Картинка</td><td>Купон, плитка в кассе, активный бонус, «Следующие»</td></tr><tr><td>Сумма или %, лимит</td><td>Везде: купон, плитка, активный бонус, «Следующие», история, уведомления</td></tr><tr><td>Название</td><td>Везде</td></tr><tr><td>Мин. депозит</td><td>Купон (строка «Депозит»). В кассе только если суммы не хватает</td></tr><tr><td>Вейджер</td><td>Купон, плитка в кассе</td></tr><tr><td>Номер депозита / уровни / дата окончания</td><td>Чип в углу купона (что-то одно, по порядку: уровень, номер депозита, дата)</td></tr><tr><td>Срок отыгрыша</td><td>Активный бонус и «Следующие» как дата («до 25 ноября»)</td></tr><tr><td>Категории игр, макс. ставка, макс. выигрыш, лимит на игрока, описание</td><td>Только в окне условий (кнопка i)</td></tr></table></div></div>
  <div><h5>Все варианты купона</h5>${grid(["ten","gold","ruby","nowag","long","noart"].map(k=>B[k]))}</div>
  <div><h5>После MVP: фриспины и пакет. Те же слоты</h5>${grid([B.fs,B.pack])}</div>
</div>`,{faq:false})};

/* ── Экраны ── */
const W1=["wait","next","wait"], W0=["next","wait","wait"], WD=["done","next","wait"];
const S={
  main:{st:{act:"w1",queue:["fri","ten"],wel:W1},r:()=>page()},
  soon:{st:{act:"w1",queue:[],wel:W1,soon:true},r:()=>page()},
  zero:{st:{act:"fri",queue:[],wel:WD,zero:true},r:()=>page()},
  regdone:{st:{act:"reg",queue:[],wel:W0,zero:true},r:()=>page()},
  noact:{st:{act:null,queue:[],wel:W0},r:()=>page()},
  guest:{st:{act:null,queue:[],wel:W0},r:()=>guestPage()},
  lvbronze:{lvl:2,st:{act:null,queue:[],wel:WD},r:()=>page()},
  lvdiamond:{lvl:7,st:{act:null,queue:[],wel:WD},r:()=>page()},
  lvgold:{lvl:4,st:{act:null,queue:[],wel:WD},r:()=>page()},
  cryptolong:{cur:"BTC12",st:{act:"w1",queue:["fri","ten"],wel:W1},r:()=>page()},
  longq:{st:{act:"w1",queue:["fri","ten","slots","wk","mn","rl","nowag","noart","long","w2","w3","mid"],wel:W1},r:()=>page()},
  curempty:{pf:"EUR",wallets:["USD","EUR"],st:{act:null,queue:[],wel:W0},r:()=>page()},
  many:{st:{act:null,queue:[],wel:WD},r:()=>page({keys:["fri","ten","slots","long","noart","nowag","wk","rl","mn","gold","ruby"],cut:1})},
  terms:{st:{act:"w1",queue:["fri","ten"],wel:W1},r:()=>page(),after:()=>openTerms("w2","")},
  termsmin:{st:{act:"w1",queue:["fri","ten"],wel:W1},r:()=>page(),after:()=>openTerms("ten","")},
  cancel:{st:{act:"w1",queue:["fri","ten"],wel:W1},r:()=>page(),after:()=>openCancel("w1")},
  cash:{st:{act:"w1",queue:["fri","ten"],wel:W1},r:a=>cashier(a||{})},
  cashpick:{st:{act:null,queue:[],wel:WD},r:a=>cashier(typeof a==="string"?{sel:a}:a||{sel:"w2"})},
  cashmin:{st:{act:null,queue:[],wel:WD},r:a=>cashier(a||{A:20,sel:"fri",keepA:1})},
  cashnone:{st:{act:null,queue:[],wel:WD},r:a=>cashier(a||{empty:1})},
  cashcrypto:{st:{act:"w1",queue:[],wel:W1},r:a=>cashier(a||{crypto:1})},
  reg:{st:{act:null,queue:[],wel:W0},r:a=>{REG=a==="reg"?"reg":"none";return reg()}},
  hist:{st:{act:"w1",queue:["fri","ten"],wel:W1},r:()=>site(hist(),{tab:"История",faq:false})},
  histempty:{st:{act:null,queue:[],wel:W0},r:()=>site(hist(1),{tab:"История",faq:false})},
  ntf:{st:{act:"ten",queue:[],wel:WD},r:()=>page({ntf:1,unread:1})},
  core:{st:{act:null,queue:[],wel:WD},r:()=>coreSheet()}
};
let cur="main", ARG;
function go(s,arg,reset){
  if(reset){FORCECUR=S[s].cur||null;PF=S[s].pf||null;WALLETS=S[s].wallets||null;ME.level=S[s].lvl??3}
  if(reset) ST={zero:false,soon:false,gone:[],...S[s].st,queue:[...S[s].st.queue]};
  closeDlg(); cur=s;ARG=arg;
  const cb=document.getElementById("curbox"); if(cb) cb.style.display=s.startsWith("cash")?"none":"";
  document.querySelectorAll("#states button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
  draw(true,true); S[cur].after?.();
  document.querySelector(".stage").scrollTop=0;
}
function draw(fresh,first){
  const f=document.getElementById("frame"); CUR=PC();
  f.className="frame f"+f.dataset.w+(first?" first":"");
  f.innerHTML=cur.startsWith("cash")?(fresh?S[cur].r(ARG):cashier()):S[cur].r(ARG);
  fitAll();
}
/* Кегль суммы: по измеренной ширине поля, а не по числу знаков. В ряду купонов кегль один */
function fitAll(){
  /* Кнопки активного блока: ровно той же высоты, что текст рядом */
  const wide=!/f(390|820)/.test(document.getElementById("frame").className);
  
  const over=e=>e.scrollWidth>e.clientWidth+1;
  document.querySelectorAll("#frame .grid, #frame .sizes, #dlg .th").forEach(g=>{for(let z=1;z<=6;z++){g.dataset.z=z;if(![...g.querySelectorAll(".cw:not(.hid) .of b, .of b")].filter(b=>b.offsetParent).some(over))break}});
  document.querySelectorAll("#frame [data-fit], #dlg [data-fit]").forEach(e=>{e.style.fontSize="";const base=parseFloat(getComputedStyle(e).fontSize);
    for(const k of [1,.86,.74,.64,.56]){e.style.fontSize=(base*k).toFixed(1)+"px";if(!over(e))break}});
}
document.getElementById("w").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#w button").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("frame").dataset.w=b.dataset.v;draw(true);S[cur].after?.()};
document.getElementById("cur").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#cur button").forEach(x=>x.classList.toggle("on",x===b));PAGECUR=b.dataset.v;PF=null;draw(true);S[cur].after?.()};
document.getElementById("annot").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#annot button").forEach(x=>x.classList.toggle("on",x===b));document.body.classList.toggle("annot",b.dataset.v==="on")};
document.getElementById("states").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.s,undefined,true)};
go("main",undefined,true);
